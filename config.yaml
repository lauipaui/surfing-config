# Mihomo 配置
# 目标：结构清晰、首次启动可靠、规则集少而精，并保留常用的服务分流。

mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: always
disable-keep-alive: true
external-controller: 0.0.0.0:9090
external-ui: "./webroot/Zash/"
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

# 远程订阅配置开始（请勿删除；真实订阅仅保存在手机本地）
proxy-providers:
  provider1:
    type: http
    url: "__LOCAL_SUBSCRIPTION_URL__"
    path: ./proxy_provider/provider1.yaml
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

# 远程订阅配置结束

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"

# Surfing 当前使用 TPROXY；TUN 保持关闭。
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true

  # 以下域名返回真实 IP，改善局域网、国内应用、NTP 和联机游戏兼容性。
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.lan"
    - "+.local"
    - "+.arpa"
    - "localhost.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "*.*.xboxlive.com"
    - "WORKGROUP"

  # 只用于解析 DNS 上游地址，必须使用 IP。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 节点域名始终由直连 DNS 解析，避免代理与 DNS 互相依赖。
  proxy-server-nameserver:
    - "https://1.12.12.12/dns-query#DIRECT"
    - "https://223.5.5.5/dns-query#DIRECT"

  nameserver:
    - "https://1.12.12.12/dns-query#DIRECT"
    - "https://223.5.5.5/dns-query#DIRECT"

  nameserver-policy:
    "rule-set:private_domain":
      - system
    "rule-set:cn_domain":
      - "https://1.12.12.12/dns-query#DIRECT"
      - "https://223.5.5.5/dns-query#DIRECT"
    "rule-set:geolocation_non_cn":
      - "https://8.8.8.8/dns-query#节点选择"
      - "https://1.1.1.1/dns-query#节点选择"

  direct-nameserver:
    - "https://1.12.12.12/dns-query"
    - "https://223.5.5.5/dns-query"
  direct-nameserver-follow-policy: false

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - DIRECT
    use:
      - provider1

  - name: 自动选择
    type: url-test
    use:
      - provider1
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: 故障转移
    type: fallback
    use:
      - provider1
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: true

  - name: 负载均衡
    type: load-balance
    use:
      - provider1
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: true
    strategy: consistent-hashing

  - name: AI 服务
    type: select
    proxies: [节点选择, 自动选择, 故障转移, DIRECT]

  - name: Telegram
    type: select
    proxies: [节点选择, 自动选择, 故障转移, DIRECT]

  - name: YouTube
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

  - name: Google
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

  - name: GitHub
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

  - name: 国外媒体
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

  - name: Microsoft
    type: select
    proxies: [节点选择, DIRECT]

  - name: Apple
    type: select
    proxies: [节点选择, DIRECT]

  - name: Steam
    type: select
    proxies: [DIRECT, 节点选择]

  - name: Nodeseek
    type: select
    proxies: [节点选择, DIRECT]

  - name: 国内
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 其他
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

rule-anchor:
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

rule-providers:
  private_domain:
    <<: *domain
    path: ./rule_provider/private_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"

