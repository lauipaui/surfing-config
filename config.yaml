  github_domain:
    <<: *domain
    path: ./rule_provider/github_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs"

  telegram_domain:
    <<: *domain
    path: ./rule_provider/telegram_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs"

  youtube_domain:
    <<: *domain
    path: ./rule_provider/youtube_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs"

  google_domain:
    <<: *domain
    path: ./rule_provider/google_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs"

  google_fcm_domain:
    <<: *domain
    path: ./rule_provider/google_fcm_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/googlefcm.mrs"

  microsoft_domain:
    <<: *domain
    path: ./rule_provider/microsoft_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs"

  onedrive_domain:
    <<: *domain
    path: ./rule_provider/onedrive_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/onedrive.mrs"

  apple_domain:
    <<: *domain
    path: ./rule_provider/apple_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs"

  netflix_domain:
    <<: *domain
    path: ./rule_provider/netflix_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.mrs"

  media_domain:
    <<: *domain
    path: ./rule_provider/media_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-entertainment.mrs"

  steam_domain:
    <<: *domain
    path: ./rule_provider/steam_domain.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam.mrs"

