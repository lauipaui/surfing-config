    path: ./rule_provider/cn_ip.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"

rules:
  # 本机应用和局域网优先直连。
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,Weixin.exe,DIRECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT

  # 广告与明确拒绝项。
  - RULE-SET,ads_domain,广告拦截
  - RULE-SET,awavenue_domain,广告拦截
  - DOMAIN-SUFFIX,adobe.io,REJECT

  # 自定义及服务分流。
  - DOMAIN-SUFFIX,nodeseek.com,Nodeseek
  - RULE-SET,jsproxy,节点选择
  - RULE-SET,ai_domain,AI 服务
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,github_domain,GitHub
  - RULE-SET,google_fcm_domain,Google
  - RULE-SET,google_domain,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,onedrive_domain,Microsoft
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,Apple
  - RULE-SET,netflix_domain,国外媒体
  - RULE-SET,netflix_ip,国外媒体,no-resolve
  - RULE-SET,media_domain,国外媒体
  - RULE-SET,steam_domain,Steam

  # 国内优先直连，未分类的境外流量交给“其他”。
  - RULE-SET,cn_domain,国内
  - RULE-SET,cn_ip,国内,no-resolve
  - RULE-SET,geolocation_non_cn,其他
  - MATCH,其他
